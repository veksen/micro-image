name: Benchmark

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # never cancel a main run: it is the one that records a history point
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write
  pull-requests: write

jobs:
  benchmark:
    name: Benchmark
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # On a PR: measure and report, record nothing. Fails only if the
      # benchmark cannot run. It never fails on the numbers, because runner
      # timings are not a signal and today's byte counts describe behaviour we
      # already know is broken.
      - name: Proxy benchmark
        if: github.event_name == 'pull_request'
        run: npm run benchmark -w apps/cache
        env:
          BENCH_ITERATIONS: 5
          # the checkout sits on a merge commit; report the branch head instead
          BENCH_COMMIT: ${{ github.event.pull_request.head.sha }}

      # On main: measure and append one point to the committed history.
      - name: Proxy benchmark and record history
        if: github.event_name == 'push'
        run: npm run benchmark -w apps/cache -- --append-history
        env:
          BENCH_ITERATIONS: 15

      # One comment per PR, edited in place. Creating a new one on every push
      # buries the PR under near-identical tables.
      #
      # Fork PRs get a read-only token, so this is skipped rather than failed:
      # the job summary and the artifact still carry the numbers, and
      # pull_request_target is not worth the security exposure to avoid it.
      - name: Comment benchmark results
        if: >
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          MARKER='<!-- micro-image-benchmark -->'
          BODY_FILE=$(mktemp)
          {
            printf '%s\n' "$MARKER"
            cat apps/cache/benchmark/summary.md
            printf '\n_Posted by the Benchmark workflow. Timings are wall-clock on a shared '
            printf 'runner and move on their own; only byte counts and the counts above reproduce._\n'
          } > "$BODY_FILE"

          # --paginate matters: the endpoint returns 30 comments per page, so on a
          # busy PR the marker falls off page one and this would post a duplicate,
          # which is the exact failure the marker exists to prevent.
          EXISTING=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" \
            --jq ".[] | select(.body | startswith(\"${MARKER}\")) | .id" | head -n 1)

          if [ -n "$EXISTING" ]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${EXISTING}" \
              -F body=@"$BODY_FILE" --silent
            echo "updated comment ${EXISTING}"
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" \
              -F body=@"$BODY_FILE" --silent
            echo "created a new comment"
          fi

      - name: Micro-benchmarks
        run: |
          npm run bench -w apps/cache
          npm run bench -w packages/micro-image-image

      # "[skip ci]" is load-bearing: without it this push retriggers the
      # workflow, which appends another point, which pushes again.
      - name: Commit history point
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- apps/cache/benchmark/history.jsonl; then
            echo "no new history point to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/cache/benchmark/history.jsonl
          git commit -m "chore: record benchmark history point [skip ci]"
          # another merge may have landed while this ran
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            echo "push attempt $attempt failed, retrying"
            sleep 5
          done
          exit 1

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: |
            apps/cache/benchmark/results.json
            apps/cache/benchmark/history.jsonl
          if-no-files-found: warn
